# Aurora Song - SLE Shuttle Cannons
- type: entity
  id: ASShuttleGunFriendshipSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunFriendship]
  suffix: SLE
  components:
  - type: Machine
    board: Null

- type: entity
  id: ASShuttleGunDusterSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunDuster]
  suffix: SLE
  components:
  - type: Machine
    board: Null

# CAF shuttle weapons
- type: entity
  id: ASShuttleGunWoodpeckerCAF
  parent: [ShuttleGunBase, ConstructibleMachine]
  name: NV/C-18 "Woodpecker"
  description: A 20mm autocannon designed for general use against light and unarmored targets. This variant is designed for a fixed shuttle mount.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/launcher.rsi
    layers:
    - state: exp-2100g
    - state: mag-7
      map: ["enum.GunVisualLayers.Mag"]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      gun_magazine: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 85
    minAngle: 0
    maxAngle: 11
    angleIncrease: 1
    angleDecay: 3
    fireRate: 8
    soundGunshot:
      path: /Audio/_Impstation/Weapons/Guns/Gunshots/nemesis.ogg
      params:
        pitch: 0.75
        volume: 4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Machine
    board: Null
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ASMagazineBoxShuttle20
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ASMagazineBoxShuttle20 # exclusive ammo box for the Woodpecker cannon
