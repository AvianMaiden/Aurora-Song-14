# Aurora Song - SLE Shuttle Cannons
- type: entity
  id: ASShuttleGunFriendshipSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunFriendship]
  suffix: SLE
  components:
  - type: Machine
    board: Null

- type: entity
  id: ASShuttleGunDusterSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunDuster]
  suffix: SLE
  components:
  - type: Machine
    board: Null

- type: entity
  id: ASShuttleGunMuleSLE
  parent: [ShuttleGunBase, ConstructibleMachine]
  name: NV/MG-340 "Mule"
  description: A .30 rifle general-purpose machine gun in a fixed-mount configuration, akin to the iconic LMG-6. Not glamorous, but doesn't need to be.
  components:
  - type: Sprite
    sprite: _AS/Objects/Weapons/Guns/Shuttles/mule.rsi
    layers:
    - state: mule
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      gun_magazine: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 45
    minAngle: 0
    maxAngle: 6
    angleIncrease: 1
    angleDecay: 3
    fireRate: 10
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Machine
    board: Null
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NFMagazineBoxRifle30
        insertSound: /Audio/Weapons/Guns/MagIn/lmg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - NFMagazineBoxRifle30 # same as the L6

- type: entity
  id: ASShuttleGunMuleCoaxSLE
  parent: ASShuttleGunMuleSLE
  suffix: coaxial
  components:
  - type: Sprite
    sprite: _AS/Objects/Weapons/Guns/Shuttles/mulecoax.rsi
    layers:
    - state: coaxial
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: [ "enum.GunVisualLayers.Mag" ]

- type: entity
  id: ASShuttleGunOxSLE
  parent: ASShuttleGunMuleSLE
  name: NV/MG-2C "Ox"
  description: A .50 caliber heavy machine gun in a fixed-mount configuration; a timeless classic.
  components:
  - type: Sprite
    sprite: _AS/Objects/Weapons/Guns/Shuttles/ox.rsi
    layers:
    - state: ox
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    projectileSpeed: 55
    minAngle: 0
    maxAngle: 5
    angleIncrease: 0.5
    angleDecay: 3
    fireRate: 4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ASMagazineBoxShuttle50
        insertSound: /Audio/Weapons/Guns/MagIn/lmg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ASMagazineBoxShuttle50 # exclusive ammo box

# CAF shuttle weapons
- type: entity
  id: ASShuttleGunWoodpeckerCAF
  parent: [ShuttleGunBase, ConstructibleMachine]
  name: NV/C-18 "Woodpecker"
  description: A 20x100mm autocannon designed for general use against light and unarmored targets. This variant is designed for a fixed shuttle mount.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/launcher.rsi
    layers:
    - state: exp-2100g
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-7
      map: ["enum.GunVisualLayers.Mag"]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      gun_magazine: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 60
    minAngle: 0
    maxAngle: 7
    angleIncrease: 1
    angleDecay: 3
    fireRate: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
      params:
        volume: 4
    soundEmpty:
