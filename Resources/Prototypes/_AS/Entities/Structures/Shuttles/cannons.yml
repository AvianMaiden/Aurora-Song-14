# Aurora Song - SLE Shuttle Cannons
- type: entity
  id: ASShuttleGunFriendshipSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunFriendship]
  suffix: SLE
  components:
  - type: Machine
    board: Null

- type: entity
  id: ASShuttleGunDusterSLE
  parent: [BaseStructureDisableToolUse, ShuttleGunDuster]
  suffix: SLE
  components:
  - type: Machine
    board: Null

# CAF shuttle weapons
- type: entity
  id: ASShuttleGunWoodpeckerCAF
  parent: [ShuttleGunBase, ConstructibleMachine]
  name: NV/C-18 "Woodpecker"
  description: A 20x100mm autocannon designed for general use against light and unarmored targets. This variant is designed for a fixed shuttle mount.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/launcher.rsi
    layers:
    - state: exp-2100g
    - state: mag-7
      map: ["enum.GunVisualLayers.Mag"]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      gun_magazine: !type:ContainerSlot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Gun
    projectileSpeed: 60
    minAngle: 0
    maxAngle: 7
    angleIncrease: 1
    angleDecay: 3
    fireRate: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
      params:
        volume: 4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Machine
    board: Null
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ASMagazineBoxShuttle20
        insertSound: /Audio/Weapons/Guns/MagIn/energycrossbow_reload.ogg
        params:
          volume: 6
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ASMagazineBoxShuttle20 # exclusive ammo box

- type: entity
  id: ASShuttleGunHummingbirdCAF
  parent: ASShuttleGunWoodpeckerCAF
  name: NV/C-208 "Hummingbird"
  description: A nose-mounted 20x100mm rotary autocannon. BRRRRRRT.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Shuttles/launcher.rsi
    layers:
    - state: exp-2100g
    - state: mag-7
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    projectileSpeed: 60
    minAngle: 0
    maxAngle: 14
    angleIncrease: 0.5
    angleDecay: 6
    fireRate: 15
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false

- type: entity
