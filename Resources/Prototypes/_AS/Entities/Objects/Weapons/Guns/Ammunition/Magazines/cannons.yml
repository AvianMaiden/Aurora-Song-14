- type: entity
  id: ASMagazineBoxShuttle20
  parent: NFBaseMagazineRifle30
  name: box magazine (20x100mm autocannon)
  description: A box magazine that fits exclusively into the Woodpecker and Hummingbird mounted autocannons. Authorized for government use only.
  components:
  - type: Tag
    tags:
    - ASMagazineBoxShuttle20 # makes this ammo box exclusive to the two cannons
  - type: BallisticAmmoProvider
    proto: ASBulletShuttle20
    capacity: 200
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false

